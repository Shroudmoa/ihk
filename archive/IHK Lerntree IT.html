<style>
/* Layout: Kopfleiste, Radialbaum als Vollfläche, Legende als scrollbare Leiste, Infokarte schwebt links unten.
   Farbe: kühle Neutrale mit Petrol-Akzent; 13 Gruppenfarben über Goldenen Winkel gestreut, Helligkeit pro Theme. */
:root {
  --bg: #f2f5f6; --panel: #ffffff; --fg: #13222b; --muted: #566872; --line: #d3dce1;
  --accent: #0b6f78; --accent-fg: #ffffff; --soft: #e4ecef;
  --cs: 62%; --cl: 36%;
  --c0: hsl(8 var(--cs) var(--cl));   --c1: hsl(145 var(--cs) var(--cl));  --c2: hsl(283 var(--cs) var(--cl));
  --c3: hsl(48 var(--cs) var(--cl));  --c4: hsl(198 var(--cs) var(--cl));  --c5: hsl(336 var(--cs) var(--cl));
  --c6: hsl(113 var(--cs) var(--cl)); --c7: hsl(251 var(--cs) var(--cl));  --c8: hsl(28 var(--cs) var(--cl));
  --c9: hsl(166 var(--cs) var(--cl)); --c10: hsl(304 var(--cs) var(--cl)); --c11: hsl(81 var(--cs) var(--cl));
  --c12: hsl(219 var(--cs) var(--cl));
  --font-body: 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e161b; --panel: #162128; --fg: #e5edf1; --muted: #90a3ae; --line: #2a3943;
    --accent: #52c4cd; --accent-fg: #06262a; --soft: #1d2b33; --cs: 68%; --cl: 66%; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e161b; --panel: #162128; --fg: #e5edf1; --muted: #90a3ae; --line: #2a3943;
  --accent: #52c4cd; --accent-fg: #06262a; --soft: #1d2b33; --cs: 68%; --cl: 66%; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px; line-height: 1.45; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

#app { height: 100%; display: flex; flex-direction: column; min-width: 0; }
.bar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; background: var(--panel);
  border-bottom: 1px solid var(--line); padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.brand { min-width: 0; }
.brand h1 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
.brand p { margin: 0; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--bg); }
.seg button { border: 0; background: transparent; padding: 7px 13px; font-weight: 500; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
.search { position: relative; flex: 1 1 220px; max-width: 380px; min-width: 0; display: block; }
.search input {
  width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 8px;
  padding: 8px 76px 8px 12px; min-width: 0;
}
.search input::placeholder { color: var(--muted); }
.hits { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; pointer-events: none; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; margin-left: auto; }
.tools button { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 7px 12px; font-weight: 500; }
.tools button:hover { border-color: var(--accent); }
.tools button[aria-pressed="true"] { background: var(--soft); border-color: var(--accent); color: var(--accent); }

#stage { position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden; }
#svg { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#svg:active { cursor: grabbing; }
.hint { position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); top: 10px; margin: 0; max-width: 300px; text-align: right; font-size: 12px; color: var(--muted); pointer-events: none; }

.tl { fill: none; stroke-width: 1.1; stroke-opacity: .5; transition: stroke-opacity .15s; }
.tl.dim { stroke-opacity: .08; }
.ed { fill: none; stroke-width: 1; pointer-events: none; transition: opacity .15s; }
.n { cursor: pointer; }
.n .dot { transition: opacity .15s; }
.n.dim .dot, .n.dim text { opacity: .14; }
.n .lbl { font-size: 11.5px; fill: var(--fg); paint-order: stroke; stroke: var(--bg); stroke-width: 3px; stroke-linejoin: round; dominant-baseline: central; }
.n.group .lbl { font-size: 12.5px; font-weight: 600; }
.n.root .lbl { font-weight: 700; fill: var(--accent-fg); stroke: none; text-anchor: middle; }
.n.hit .lbl { font-weight: 700; }
.n.hit .dot { stroke: var(--fg); stroke-width: 2; }
.n.sel .dot { stroke: var(--fg); stroke-width: 2.5; }
.n.sel .lbl { font-weight: 700; }
.low .n.topic .lbl, .low .n.sub .lbl { opacity: 0; }
.low .n.topic.hit .lbl, .low .n.sub.hit .lbl, .low .n.topic.sel .lbl, .low .n.sub.sel .lbl { opacity: 1; }
.cnt { font-size: 10px; font-weight: 700; fill: var(--bg); text-anchor: middle; dominant-baseline: central; pointer-events: none; }

#card {
  position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); bottom: 12px; width: min(390px, calc(100% - 32px));
  max-height: min(60%, 460px); overflow: auto; background: var(--panel); border: 1px solid var(--line);
  border-radius: 12px; padding: 14px 16px; box-shadow: 0 6px 24px rgb(0 0 0 / .14); pointer-events: none;
}
#card.pinned { pointer-events: auto; }
#card h2 { margin: 6px 0 4px; font-size: 16px; line-height: 1.3; text-wrap: balance; }
#card p { margin: 4px 0; }
#card .top { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
#card .top .swatch { width: 10px; height: 10px; border-radius: 50%; flex: none; }
#card .tag { border: 1px solid var(--line); border-radius: 99px; padding: 0 8px; font-size: 11px; }
#card .path { font-family: var(--font-mono); font-size: 11px; color: var(--muted); word-break: break-all; }
#card .muted { color: var(--muted); font-size: 12px; }
#card h3 { margin: 12px 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { border: 1px solid var(--line); background: var(--bg); border-radius: 99px; padding: 3px 10px; font-size: 12px; text-align: left; }
.chips button:hover { border-color: var(--accent); color: var(--accent); }
#card .gh { display: inline-block; margin-top: 10px; color: var(--accent); font-weight: 600; text-decoration: none; }
#card .gh:hover { text-decoration: underline; }
#card .x { position: absolute; right: 8px; top: 6px; border: 0; background: transparent; font-size: 20px; line-height: 1; color: var(--muted); padding: 4px 8px; }

.legend {
  display: flex; gap: 8px; overflow-x: auto; background: var(--panel); border-top: 1px solid var(--line); padding-block: 9px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.legend button {
  flex: none; display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); background: var(--bg);
  border-radius: 99px; padding: 4px 11px; font-size: 12.5px; white-space: nowrap;
}
.legend button .sw { width: 10px; height: 10px; border-radius: 50%; }
.legend button .c { color: var(--muted); font-variant-numeric: tabular-nums; }
.legend button[aria-pressed="true"] { border-color: var(--fg); background: var(--soft); font-weight: 600; }
@media (max-width: 700px) {
  .hint { display: none; }
  .tools { margin-left: 0; }
  #card { max-height: 48%; }
}
@media (prefers-reduced-motion: reduce) { .tl, .ed, .n .dot { transition: none; } }
</style>

<div id="app">
  <header class="bar">
    <div class="brand"><h1 id="ttl"></h1><p id="stats"></p></div>

  </main>
  <nav id="legend" class="legend" aria-label="Gruppen"></nav>
</div>

    card.className = '';
    card.innerHTML = '<div class="top"><span class="swatch" style="background:var(--c' + d.ci + ')"></span><span>' + (st.view === 'themen' ? 'Gruppe' : 'Station') + '</span></div>' +
      '<h2>' + esc(d.name) + '</h2><p class="muted">' + d.count + ' Lernblätter · Klick klappt die Gruppe ' + (n.children ? 'ein' : 'aus') + '</p>';
    return;
  }
  const pinned = !hv || hv.data.id === (pn && pn.data.id);
  const i = d.info, rel = [...(ADJ[d.path] || [])].map((p) => INFO[p]).filter(Boolean);
  card.className = pinned && pn ? 'pinned' : '';
  card.innerHTML =
    (pinned && pn ? '<button class="x" type="button" data-x="1" aria-label="Schließen">×</button>' : '') +
    '<div class="top"><span class="swatch" style="background:var(--c' + d.ci + ')"></span><span>' + esc(groupOf(n).data.name) + '</span>' +
    (i.cross ? '<span class="tag">Bereich ' + OTHER + '</span>' : '') + '</div>' +
    '<h2>' + esc(i.title) + '</h2>' + (i.desc ? '<p>' + esc(i.desc) + '</p>' : '') +
    '<p class="path">' + esc(d.path) + '</p>' +
    (rel.length ? (pinned && pn
      ? '<h3>Verknüpft (' + rel.length + ')</h3><div class="chips">' + rel.map((r) => '<button type="button" data-p="' + esc(r.path) + '">' + esc(r.short) + '</button>').join('') + '</div>'
      : '<p class="muted">' + rel.length + ' Querverweise · anklicken zum Fixieren</p>') : '') +
    '<a class="gh" href="' + REPO + esc(d.path) + '" target="_blank" rel="noopener">Auf GitHub öffnen ↗</a>';
}
$('card').addEventListener('click', (e) => {
  if (e.target.closest('[data-x]')) { st.pin = null; refresh(); return; }
  const b = e.target.closest('[data-p]');
  if (b) pinPath(b.dataset.p);
});

/* ---------- Gruppen, Legende ---------- */
function toggleGroup(key) {
  if (st.collapsed.has(key)) st.collapsed.delete(key); else st.collapsed.add(key);
  st.pin = null; st.hover = null; draw();
}
function renderLegend() {
  const arr = st.view === 'themen' ? DATA.groups.map((g) => [g.name, g.topics.length]) : DATA.stations.map((s) => [s.name, s.paths.length]);
  const pre = st.view === 'themen' ? 'g' : 's';
  $('legend').innerHTML = arr.map(([n, c], i) =>
    '<button type="button" data-k="' + pre + i + '" aria-pressed="false"><span class="sw" style="background:var(--c' + (i % NC) + ')"></span>' + esc(n) + ' <span class="c">' + c + '</span></button>').join('');
}
$('legend').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  const k = b.dataset.k;
  if (st.group === k) { st.group = null; refresh(); return; }
  st.group = k;
  if (st.collapsed.has(k)) { st.collapsed.delete(k); draw(); } else refresh();
  const g = idMap.get(k);
  if (g) {
    const pts = g.children ? g.children.map((c) => [c.px, c.py]) : [[g.px, g.py]];
    const mx = d3.mean(pts, (p) => p[0]), my = d3.mean(pts, (p) => p[1]);
    const spread = g.children ? Math.hypot(d3.max(pts, (p) => p[0]) - d3.min(pts, (p) => p[0]), d3.max(pts, (p) => p[1]) - d3.min(pts, (p) => p[1])) : 200;
    const box = $('svg').getBoundingClientRect();
    zoomTo(mx, my, Math.min(2.2, Math.max(0.7, Math.min(box.width, box.height) / (spread + 420))));
  }
});

/* ---------- Zoom ---------- */
const zoom = d3.zoom().scaleExtent([0.08, 5]).on('zoom', (e) => {
  gz.attr('transform', e.transform); curK = e.transform.k;
  $('svg').classList.toggle('low', curK < 0.55);
  if (e.sourceEvent) moved = true;
});
svg.call(zoom).on('dblclick.zoom', null).on('click', () => { st.pin = null; refresh(); });
function zoomTo(x, y, k) {
  const b = $('svg').getBoundingClientRect();
  svg.transition().duration(550).call(zoom.transform, d3.zoomIdentity.translate(b.width / 2 - x * k, b.height / 2 - y * k).scale(k));
}
function fit(animate) {
  const b = $('svg').getBoundingClientRect();
  const k = Math.min(b.width, b.height) / (2 * cur.extent) * 0.97;
  const t = d3.zoomIdentity.translate(b.width / 2, b.height / 2).scale(k);
  (animate ? svg.transition().duration(500) : svg).call(zoom.transform, t);
  moved = false;
}
function pinPath(p) {
  let n = null;
  cur.root.each((d) => { if (!n && d.data.path === p) n = d; });
  if (!n) return;
  st.pin = n.data.id; st.group = null; refresh();
  zoomTo(n.px, n.py, Math.max(curK, 1.1));
}

/* ---------- Bedienung ---------- */
function setView(v) {
  if (st.view === v) return;
  st.view = v; st.collapsed = new Set(); st.pin = null; st.hover = null; st.group = null;
  $('v-themen').setAttribute('aria-pressed', String(v === 'themen'));
  $('v-story').setAttribute('aria-pressed', String(v === 'story'));
  try { history.replaceState(null, '', '#' + (v === 'story' ? 'lerngeschichte' : 'themen')); } catch (e) {}
  draw(); fit(true);
}
$('v-themen').onclick = () => setView('themen');
$('v-story').onclick = () => setView('story');
$('b-edges').onclick = () => { st.edges = !st.edges; $('b-edges').setAttribute('aria-pressed', String(st.edges)); refresh(); };
$('b-fit').onclick = () => fit(true);
$('b-toggle').onclick = () => {
  const keys = groupKeys();
  st.collapsed = st.collapsed.size >= keys.length ? new Set() : new Set(keys);
  st.pin = null; st.hover = null; draw(); fit(true);
};
$('q').addEventListener('input', (e) => { st.q = e.target.value.trim().toLowerCase(); st.group = null; refresh(); });
$('q').addEventListener('keydown', (e) => {
  if (e.key !== 'Enter' || !st.q) return;
  const ms = matchSet(); if (!ms || !ms.size) return;
  const first = [...ms][0];
  const keys = groupKeys();
  const src = st.view === 'themen' ? DATA.groups.map((g) => g.topics.flatMap((t) => [t.path, ...t.children.map((c) => c.path)])) : DATA.stations.map((s) => s.paths);
  let opened = false;
  src.forEach((ps, i) => { if (ps.includes(first) && st.collapsed.has(keys[i])) { st.collapsed.delete(keys[i]); opened = true; } });
  if (opened) draw();
  pinPath(first);
});
document.addEventListener('keydown', (e) => { if (e.key === '/' && document.activeElement !== $('q')) { e.preventDefault(); $('q').focus(); } });
window.addEventListener('resize', () => { if (!moved) fit(false); });

if (location.hash === '#lerngeschichte') { st.view = 'story'; $('v-themen').setAttribute('aria-pressed', 'false'); $('v-story').setAttribute('aria-pressed', 'true'); }
draw();
fit(false);
</script>

</body></html>
